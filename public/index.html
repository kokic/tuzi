<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tuzi</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #app {
            height: 100%;
        }

        html {
            font-size: var(--root-font-size, 18px);
        }

        #tuzi,
        #tuzi * {
            scrollbar-width: thin;
            scrollbar-color: var(--rui-border) transparent;
        }

        #tuzi .entry-row:hover {
            --tuzi-row-hover: var(--rui-muted);
        }

        #tuzi-command-dialog::backdrop {
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
        }

        #tuzi .entry-row input:focus-visible {
            outline: 2px solid var(--rui-ring);
            outline-offset: 2px;
        }

        @container file-pane (max-width: 32rem) {
            #tuzi .plist {
                --tuzi-time-column: 10ch;
            }

            #tuzi .entry-time-clock {
                display: none;
            }
        }

        @container file-pane (max-width: 23rem) {
            #tuzi .plist {
                --tuzi-time-column: 5ch;
            }

            #tuzi .entry-time-year {
                display: none;
            }
        }

        #tuzi .phead [aria-current="page"] {
            font-weight: 400 !important;
        }

        @media (hover: hover) {
            #tuzi .phead [data-slot="breadcrumb"] button:hover {
                font-weight: 600 !important;
            }
        }

    </style>
</head>

<body>
    <div id="app"></div>
</body>

</html>
