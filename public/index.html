<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tuzi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&display=swap');
    </style>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #app {
            height: 100%;
        }

        #tuzi,
        #tuzi * {
            scrollbar-width: thin;
            scrollbar-color: var(--tuzi-scrollbar-thumb) var(--tuzi-scrollbar-track);
        }

        #tuzi .entry-row:hover {
            --tuzi-row-hover: var(--rui-muted);
        }

        #tuzi [data-slot="context-menu-content"][popover]:not(:popover-open),
        #tuzi [data-slot="dropdown-menu-content"][popover]:not(:popover-open),
        #tuzi [data-slot="select-content"][popover]:not(:popover-open) {
            display: none !important;
        }

        #tuzi-command-dialog::backdrop {
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
        }

        #tuzi[data-tuzi-theme="light"] .entry-row input[type="checkbox"] {
            appearance: none;
            box-sizing: border-box;
            display: grid;
            place-content: center;
            border: 1px solid var(--tuzi-checkbox-border);
            border-radius: 2px;
            background: var(--tuzi-checkbox-background);
        }

        #tuzi[data-tuzi-theme="light"] [data-variant="link"] {
            --rui-button-fg: var(--rui-foreground);
            --rui-badge-fg: var(--rui-foreground);
        }

        #tuzi :is([data-slot="button"], .breadcrumb-path, .tuzi-text-action):not([data-size^="icon"]):not([data-rui-close-icon]) {
            /* Override the components' inline font weight / font shorthand. */
            font-weight: var(--tuzi-text-action-weight, 400) !important;
        }

        @media (hover: hover) {
            #tuzi :is([data-slot="button"], .breadcrumb-path, .tuzi-text-action):not([data-size^="icon"]):not([data-rui-close-icon]):not(:disabled):not([aria-disabled="true"]):hover {
                --rui-button-bg: var(--rui-button-base-bg, transparent);
                --rui-control-bg: var(--rui-control-base-bg, transparent);
                --tuzi-text-action-weight: 600;
            }

            #tuzi[data-tuzi-theme="light"] .rui-markdown-anchor:hover,
            #tuzi[data-tuzi-theme="light"] :is([data-slot="field-description"], [data-slot="empty-description"], [data-slot="item-description"])>a:hover {
                color: var(--rui-foreground);
            }

            #tuzi[data-tuzi-theme="light"] .entry-row input[type="checkbox"]:not(:checked):hover {
                background: var(--tuzi-checkbox-hover-background);
            }
        }

        #tuzi[data-tuzi-theme="light"] .entry-row input[type="checkbox"]:checked {
            border-color: var(--tuzi-checkbox-checked-border);
            background: var(--tuzi-checkbox-checked-background);
        }

        #tuzi[data-tuzi-theme="light"] .entry-row input[type="checkbox"]:checked::before {
            content: "";
            width: 9px;
            height: 7px;
            background: var(--tuzi-checkbox-checkmark);
            clip-path: polygon(0 45%, 20% 25%, 40% 55%, 80% 0, 100% 20%, 40% 100%);
        }

        #tuzi .entry-row input:focus-visible {
            outline: 2px solid var(--rui-ring);
            outline-offset: 2px;
        }

        @container file-pane (max-width: 32rem) {
            #tuzi .plist {
                --tuzi-time-column: 10ch;
            }

            #tuzi .entry-time-clock {
                display: none;
            }
        }

        @container file-pane (max-width: 23rem) {
            #tuzi .plist {
                --tuzi-time-column: 5ch;
            }

            #tuzi .entry-time-year {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
</body>

</html>
