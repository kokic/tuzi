<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tuzi</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }

        #app {
            height: 100%;
        }

        html {
            font-size: var(--root-font-size, 18px);
        }

        #tuzi .entry-row:hover {
            --tuzi-row-hover: var(--rui-muted);
        }

        #tuzi .entry-row input:focus-visible {
            outline: 2px solid var(--rui-ring);
            outline-offset: 2px;
        }

        #tuzi .phead [aria-current="page"] {
            font-weight: 600;
        }

        @media (prefers-reduced-motion: reduce) {
            #tuzi .entry-row {
                transition: none;
            }
        }

        .file-icon-svg>svg {
            position: absolute;
            inset: 0;
            margin: auto;
            display: block;
            width: 70%;
            height: 70%;
        }
    </style>
</head>

<body>
    <div id="app"></div>
</body>

</html>
