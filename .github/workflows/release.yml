name: Release Native Bundles

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: ${{ matrix.asset_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_id: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-latest
            asset_id: aarch64-apple-darwin
            extension: ''
          - os: ubuntu-latest
            asset_id: x86_64-unknown-linux-gnu
            extension: ''
    env:
      ASSET_NAME: tuzi-${{ github.event.release.tag_name }}-${{ matrix.asset_id }}${{ matrix.extension }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: moonbitlang/core/.github/actions/setup@main

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Warren
        run: moon install moonbit-community/warren

      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "Expected arm64 runner, got $arch"
            exit 1
          fi

      - name: Build native bundle
        run: warren build --bundle --browser-entry app/browser --server-entry app/tuzi

      - name: Package binary
        shell: bash
        run: mv dist/tuzi.exe "dist/$ASSET_NAME"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ASSET_NAME }}
          fail_on_unmatched_files: true
